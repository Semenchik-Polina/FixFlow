version: 2

# Version updates go to dev, the integration branch; main only receives milestones (ADR 0006)
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # MediatR >= 13 is commercially licensed; stay on the Apache-2.0 12.x line (ADR 0004)
      - dependency-name: "MediatR"
        versions: [">= 13"]

  - package-ecosystem: npm
    directory: "/web"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; take TypeScript 7 once it does (plan P16)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The SDK and runtime stay on the .NET 10 LTS line (D17); a new major is a deliberate upgrade.
      # Both forms, since the name may or may not keep the registry.
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      # The SPA build's Node major follows web/.nvmrc
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # PostgreSQL major upgrades are deliberate and need a data migration (ARCHITECTURE §20)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Built locally from the Dockerfile (the `full` profile), not pulled from a registry
      - dependency-name: "fixflow-*"
