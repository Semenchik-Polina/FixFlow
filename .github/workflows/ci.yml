name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels its older run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # NuGetAudit + TreatWarningsAsErrors (Directory.Build.props): a vulnerable package fails here
      - name: Restore (NuGet audit)
        run: dotnet restore FixFlow.slnx

      - name: Build
        run: dotnet build FixFlow.slnx --no-restore -c Release

      # The build writes the OpenAPI document; the committed one must match it (plan P9)
      - name: OpenAPI document is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/FixFlow.API/openapi.json)" ]; then
            echo "::error file=src/FixFlow.API/openapi.json::The OpenAPI document is stale. Run 'dotnet build' and commit src/FixFlow.API/openapi.json."
            git diff -- src/FixFlow.API/openapi.json
            exit 1
          fi

      - name: Test
        run: dotnet test FixFlow.slnx --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The backend job keeps openapi.json in step with the API; this keeps the client in step with openapi.json
      - name: Generate the API client
        run: npm run gen:api

      - name: Generated API client is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            echo "::error file=web/src/api/generated::The generated API client is stale. Run 'npm run gen:api' in web/ and commit src/api/generated."
            git status --porcelain -- src/api/generated
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Built and checked, never pushed: nothing is published or deployed (ARCHITECTURE §20)
      - name: Build the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          load: true
          tags: fixflow-migrate:ci
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: fixflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Images run as non-root
        run: |
          for image in fixflow-migrate:ci fixflow-api:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            if [ -z "$user" ] || [ "${user%%:*}" = "root" ] || [ "${user%%:*}" = "0" ]; then
              echo "::error file=Dockerfile::$image runs as root (USER '$user')"
              exit 1
            fi
          done

      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose --profile full config --quiet

  # Playwright against the Compose `full` profile over HTTPS (ARCHITECTURE §19, plan T1.8)
  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # All requests reach the API from Docker's gateway, so they share one auth rate-limit budget (plan P28)
      FIXFLOW_AUTH_PERMIT_LIMIT: 1000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # scripts/dev-cert.sh uses the SDK's dev-certs tool
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: tests/web-e2e/package-lock.json

      # The fast checks first, before the images and the stack
      - name: Install
        working-directory: tests/web-e2e
        run: npm ci

      - name: Audit dependencies
        working-directory: tests/web-e2e
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: tests/web-e2e
        run: npm run lint

      - name: Type-check
        working-directory: tests/web-e2e
        run: npm run typecheck

      - uses: docker/setup-buildx-action@v4

      # Tagged with Compose's image names, so `up --no-build` runs them. Reads the image job's cache; only it writes.
      - name: Build the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          load: true
          tags: fixflow-migrate:local
          cache-from: type=gha,scope=migrate

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: fixflow-api:local
          cache-from: type=gha,scope=api

      - name: Export the development certificate
        run: ./scripts/dev-cert.sh

      - name: Start the full profile
        run: |
          cp .env.example .env
          docker compose --profile full up -d --no-build --wait --wait-timeout 300

      - name: Install Chromium
        working-directory: tests/web-e2e
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests
        working-directory: tests/web-e2e
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/web-e2e/playwright-report/
            tests/web-e2e/test-results/
          retention-days: 7

      - name: Compose logs
        if: failure()
        run: docker compose --profile full logs --no-color

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep in step with the local gitleaks used by .githooks/pre-commit; Dependabot can't bump these
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      # PRs: only the PR's own commits. Pushes to main and manual runs: all of main's history.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then range="$BASE_SHA..$HEAD_SHA"; else range="HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner --log-opts="$range" .